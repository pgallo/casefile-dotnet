name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Casefile.sln --configuration Release
      - name: Test
        run: dotnet run --project tests/Casefile.Tests --configuration Release --no-build
      - name: CLI demo
        run: dotnet run --project src/Casefile.Cli --configuration Release --no-build -- search "wire transfer AND status:Open"
